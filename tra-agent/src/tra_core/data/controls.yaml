# Common control set and framework crosswalk.
#
# One common control (CC-nnn) maps to up to five framework references. Agents
# may only cite IDs that exist in this file; the controls MCP server enforces it.
#
# Framework versions:
#   iso27001:     ISO/IEC 27001:2022 Annex A
#   e8:           ASD Essential Eight maturity model, target Maturity Level 2
#   asd_essentials: successor ASD baseline, expected around Q2 2027 (empty until published)
#   ism:          ASD ISM control IDs. Deliberately empty: populate from the current
#                 ISM release and re-check at every ISM update before use.
#   pci_dss:      PCI DSS v4.0.1 requirements
#
# This is a starter crosswalk: have the control owner verify each mapping
# before TRAs rely on it. Replace this file with the corporate control catalogue when it is available.

meta:
  version: "2026.10.0"
  owner: security-architecture
  review_due: "2027-01-31"
  e8_target_maturity: 2
  frameworks:
    iso27001: "ISO/IEC 27001:2022"
    e8: "ASD Essential Eight (ML2 target)"
    asd_essentials: "ASD Essentials (expected Q2 2027)"
    ism: "ASD ISM (populate from current release)"
    pci_dss: "PCI DSS v4.0.1"

controls:

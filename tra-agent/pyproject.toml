[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tra-agent"
version = "0.1.0"
description = "Threat and risk assessment (TRA) agent: platform-neutral core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
aws = ["boto3>=1.35"]
azure = ["openai>=1.50", "azure-identity>=1.17"]
confluence = ["httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mcp>=2.0"]

[project.scripts]
tra-agent = "tra_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tra_core = ["data/*.yaml", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

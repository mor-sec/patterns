# TRA agent: release gates. Every change to the agent, its prompts, its
# reference data or its infrastructure must pass all of these before merge.
# On main, the image is also pushed, signed (keyless, Sigstore) and given an
# SBOM attestation.
#
# Actions are pinned by commit SHA; the comment gives the tag. Check each SHA
# against the publisher's release page when you update it.
name: tra-agent

on:
  pull_request:
    paths: ["tra-agent/**", ".github/workflows/tra-agent.yml"]
  push:
    branches: [main]
    paths: ["tra-agent/**", ".github/workflows/tra-agent.yml"]

permissions:
  contents: read

concurrency:
  group: tra-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tra-agent

env:
  PYTHON_VERSION: "3.13"
  IMAGE: ghcr.io/${{ github.repository }}/tra-agent

jobs:
  test:
    name: Lint, tests, red-team, golden set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tra-agent/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff pip-audit
      - name: Lint
        run: ruff check src tests infra eval
      - name: Unit, platform and red-team tests
        run: pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Golden set (recorded model output)
        run: tra-eval --replay-dir eval/replays --out eval-out
      - name: Dependency audit
        run: pip-audit --skip-editable --progress-spinner off
      - name: Evaluation report
        if: always()
        run: cat eval-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: test-and-eval
          path: |
            tra-agent/test-results.xml
            tra-agent/eval-out/
          retention-days: 30

  infra:
    name: Infrastructure (CDK and Bicep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"   # jsii runtime for aws-cdk-lib
      - name: CDK assertions
        working-directory: tra-agent/infra/aws
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q -p no:cacheprovider tests
      - name: Bicep build and lint
        working-directory: tra-agent/infra/azure
        run: |
          az bicep install
          az bicep build --file main.bicep --stdout > /dev/null
          az bicep lint --file main.bicep --diagnostics-format sarif > bicep-lint.sarif
          if grep -q '"level": "error"' bicep-lint.sarif; then cat bicep-lint.sarif; exit 1; fi

  image:
    name: Image build, scan, SBOM, sign
    needs: [test, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # push to GHCR on main
      id-token: write    # keyless signing on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (amd64, loaded for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: tra-agent
          platforms: linux/amd64
          build-args: |
            ENTRY=tra_platform.foundry
          load: true
          tags: tra-agent:ci
          provenance: false
      - name: Vulnerability scan (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: tra-agent:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Misconfiguration scan (Dockerfile and IaC, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: tra-agent
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: tra-agent:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      # ------------------------------------------------ main only: publish and sign
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push both architectures
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: tra-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Sign and attest the SBOM (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

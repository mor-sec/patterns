# TRA agent: golden set against live models on Bedrock (Sydney, AU inference
# profile). Weekly, and on demand before a prompt or model change merges.
# Each case runs three times and the gate uses the worst run.
#
# Needs a GitHub OIDC role in the evaluation account (repository variable
# TRA_EVAL_ROLE_ARN) allowed only bedrock:InvokeModel on the AU profiles.
# Golden artefacts are fictional; no real designs go through this workflow.
name: tra-agent-live-eval

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case (the gate uses the worst)
        default: "3"
      only:
        description: Case IDs to run, space separated (blank for all)
        default: ""
  schedule:
    - cron: "0 19 * * 0"   # Monday 05:00 AEST

permissions:
  contents: read
  id-token: write

concurrency:
  group: tra-agent-live-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: tra-eval
    defaults:
      run:
        working-directory: tra-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.TRA_EVAL_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: tra-live-eval-${{ github.run_id }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Golden set on live models
        env:
          REPEAT: ${{ inputs.repeat || '3' }}
          ONLY: ${{ inputs.only }}
        run: |
          # ONLY is a space-separated list of case IDs; word splitting is intended.
          # shellcheck disable=SC2086
          tra-eval --models config/models.yaml --repeat "$REPEAT" ${ONLY:+--only $ONLY} --out eval-out
      - name: Evaluation report
        if: always()
        run: cat eval-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: live-eval-${{ github.run_id }}
          path: tra-agent/eval-out/
          retention-days: 90

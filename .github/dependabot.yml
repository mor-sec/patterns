version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /tra-agent
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directory: /tra-agent/infra/aws
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /tra-agent
    schedule: {interval: weekly}
